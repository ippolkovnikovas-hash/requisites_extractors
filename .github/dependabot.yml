version: 2

updates:
  # Только GitHub Actions. Для pip обновления не включаем: версии в
  # requirements/*.txt не закреплены, и Dependabot создавал бы шум без пользы.
  # Имеет смысл включить, когда версии будут запинены.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
