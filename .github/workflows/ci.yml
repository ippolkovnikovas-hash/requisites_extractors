name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установка ruff
        run: python -m pip install --upgrade pip ruff

      - name: ruff
        run: ruff check app/ scripts/ tests/

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      # Без облака и без Ollama: тесты идут на mock-провайдере,
      # сетевые вызовы Yandex в тестах подменены.
      LLM_PROVIDER: mock
      OCR_BACKEND: tesseract

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Системные зависимости (Tesseract, Poppler, libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-rus \
            poppler-utils \
            libmagic1

      # easyocr тянет torch (~500 МБ) и в тестах не используется.
      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          grep -v -i easyocr requirements/base.txt > /tmp/base-ci.txt
          # dev.txt начинается с BOM — поэтому без якоря ^
          sed 's#-r base.txt#-r /tmp/base-ci.txt#' requirements/dev.txt > /tmp/dev-ci.txt
          pip install -r /tmp/dev-ci.txt

      - name: Проверка окружения
        run: |
          python --version
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      # Порог покрытия задан в pyproject.toml (--cov-fail-under).
      - name: pytest
        run: pytest
