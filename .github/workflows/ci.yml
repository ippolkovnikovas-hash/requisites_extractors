name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — незачем гонять сборку
# для устаревшего коммита.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      # Линтерам не нужны ни системные библиотеки, ни зависимости проекта —
      # ставим только их, чтобы замечания приходили быстро.
      - name: Установка ruff и black
        run: python -m pip install --upgrade pip ruff black

      - name: ruff
        run: ruff check app/ scripts/ tests/

      - name: black
        run: black --check app/ scripts/ tests/

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      # Никаких обращений к Ollama или куда-либо ещё: тесты идут на локальном
      # mock-провайдере (CLAUDE.md — внешние сервисы запрещены).
      LLM_PROVIDER: mock
      # Артефакты в CI не сохраняем: тесты и так уводят рабочие папки в tmp_path,
      # но пусть настройка будет явной.
      PERSIST_ARTIFACTS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      # Тесты сейчас не запускают OCR, но окружение держим совпадающим с
      # документированными требованиями: если появится тест на скан, он не
      # упадёт на пустом месте.
      - name: Системные зависимости (Tesseract, Poppler, libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-rus \
            poppler-utils \
            libmagic1

      # requirements/dev.txt не содержит easyocr: он вынесен в отдельный файл,
      # потому что тянет torch (~500 МБ), а в тестах не используется.
      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Проверка окружения
        run: |
          python --version
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      # Порог покрытия задан в pyproject.toml (--cov-fail-under).
      - name: pytest
        run: pytest
