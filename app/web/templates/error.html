{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-body p-5 text-center">
        <div class="display-6 mb-2">{{ code }}</div>
        <h2 class="h5 mb-3">{{ title }}</h2>
        {% if details %}
        <p class="text-muted">{{ details }}</p>
        {% endif %}
        <a href="{{ url_for('web.index') }}" class="btn btn-primary mt-3">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
