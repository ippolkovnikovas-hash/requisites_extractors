[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "requisites_extractor"
version = "0.1.0"
requires-python = ">=3.13"

[project.scripts]
requisites-extractor = "scripts.run_app:main"
reqextract = "scripts.run_cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -q --cov=app --cov-fail-under=93"

[tool.coverage.run]
source = ["app"]
# Список сокращается по мере покрытия (эпик Э9 в ROADMAP.md) и никогда не
# расширяется. После Э9/Э11 под измерением весь код, кроме настройки логирования:
# она состоит из вызовов loguru и осмысленных утверждений о ней не сделать.
omit = [
    "app/logging_config.py",
]
