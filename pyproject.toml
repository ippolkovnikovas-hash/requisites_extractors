[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "requisites_extractor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click==8.5.0",
    "loguru==0.7.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-docx==1.2.0",
    "pdfplumber==0.11.10",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "flask==3.1.3",
    "werkzeug==3.1.8",
    "pytesseract==0.3.13",
    "Pillow==12.3.0",
    "python-magic-bin==0.4.14; platform_system == 'Windows'",
    "python-magic==0.4.27; platform_system != 'Windows'",
    "pdf2image==1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "reportlab==5.0.1",
    "ruff==0.16.6",
    "black==26.5.1",
    "mypy==2.3.1",
]
prod = [
    "gunicorn==26.2.0",
]
easyocr = [
    "easyocr==1.7.2",
]

[project.scripts]
requisites-extractor = "scripts.run_app:main"
reqextract = "scripts.run_cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -q --cov=app --cov-fail-under=93"

[tool.coverage.run]
source = ["app"]
# Список сокращается по мере покрытия (эпик Э9 в ROADMAP.md) и никогда не
# расширяется. После Э9/Э11 под измерением весь код, кроме настройки логирования:
# она состоит из вызовов loguru и осмысленных утверждений о ней не сделать.
omit = [
    "app/logging_config.py",
]
