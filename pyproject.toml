[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "requisites_extractor"
version = "0.1.0"
requires-python = ">=3.13"

[project.scripts]
requisites-extractor = "scripts.run_app:main"
reqextract = "scripts.run_cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -q --cov=app --cov-fail-under=93"

[tool.coverage.run]
source = ["app"]
# Список сокращается по мере покрытия (эпик Э9 в ROADMAP.md) и никогда не
# расширяется. Уже под измерением: validators/, core/, schemas/,
# services/validation_service.py.
omit = [
    # Ждут собственных тестов (Э9, шаг 4). Измеренное покрытие на 23.08.2026:
    # fallback_regex 71%, text_extraction 64%, text_normalization 58%.
    "app/services/fallback_regex_service.py",
    "app/services/text_extraction_service.py",
    "app/services/text_normalization_service.py",
    "app/extractors/*",
    "app/llm/*",
    "app/ocr/*",
    "app/exporters/docx_exporter.py",
    "app/exporters/xlsx_exporter.py",
    "app/logging_config.py",
    "app/schemas/document.py",
    "app/schemas/extraction.py",
]
